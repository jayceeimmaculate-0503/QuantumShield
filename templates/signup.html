<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuantumShield - Signup</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;
        background: #050b14;
        color: #ffffff;
    }

    h1 {
        margin: 0 0 8px 0;
        font-size: 42px;
        font-weight: 700;
        color: #00e5ff;
        text-align: center;
        letter-spacing: 1px;
        text-shadow: 0 0 18px rgba(0, 229, 255, 0.45);
    }

    h3 {
        margin: 0 0 25px 0;
        color: #ffffff;
        font-size: 24px;
        text-align: center;
    }

    form {
        width: 430px;
        padding: 35px;

        background: #0d1928;
        border: 1px solid rgba(0, 229, 255, 0.35);
        border-radius: 18px;

        box-shadow:
            0 0 30px rgba(0, 229, 255, 0.08),
            0 20px 50px rgba(0, 0, 0, 0.35);
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #b8c9dc;
        font-size: 14px;
        font-weight: 500;
    }

    input {
        width: 100%;
        height: 48px;
        padding: 0 14px;

        margin-bottom: 20px;

        background: #081321;
        color: #ffffff;

        border: 1px solid #344a61;
        border-radius: 9px;

        font-size: 15px;
        outline: none;

        transition: 0.2s ease;
    }

    input:focus {
        border-color: #00e5ff;
        box-shadow: 0 0 12px rgba(0, 229, 255, 0.18);
    }

    input::placeholder {
        color: #64778b;
    }

    /* Password field wrapper */
    .password-wrapper {
        position: relative;
        width: 100%;
    }

    /* Space for eye button */
    .password-wrapper input {
        padding-right: 48px;
    }

    /* Password visibility button */
    .password-toggle {
        position: absolute;

        right: 10px;
        top: 24px;

        width: 32px;
        height: 32px;

        margin: 0;
        padding: 0;

        border: none;
        background: transparent;

        color: #8fa4b9;

        font-size: 18px;
        cursor: pointer;

        display: flex;
        justify-content: center;
        align-items: center;

        transform: translateY(-50%);
    }

    .password-toggle:hover {
        background: transparent;
        box-shadow: none;
        transform: translateY(-50%);
        color: #00e5ff;
    }

    button[type="submit"] {
        width: 100%;
        height: 50px;

        margin-top: 5px;

        border: none;
        border-radius: 9px;

        background: #00d9f5;
        color: #031018;

        font-size: 16px;
        font-weight: 700;

        cursor: pointer;
        transition: 0.2s ease;
    }

    button[type="submit"]:hover {
        background: #18e4ff;
        box-shadow: 0 0 18px rgba(0, 229, 255, 0.35);
        transform: translateY(-1px);
    }

    p {
        margin-top: 22px;
        color: #8fa4b9;
        font-size: 14px;
        text-align: center;
    }

    a {
        color: #00e5ff;
        text-decoration: none;
        font-weight: 600;
    }

    a:hover {
        text-decoration: underline;
    }

    @media (max-width: 520px) {
        form {
            width: calc(100% - 30px);
            padding: 28px;
        }

        h1 {
            font-size: 34px;
        }
    }
</style>
</head>

<body>

    <h1>QuantumShield</h1>
    <h3>Create Account</h3>

    <form method="POST" action="/signup">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Create a username"
            autocomplete="username"
            required
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <label for="password">
            Password
        </label>

        <div class="password-wrapper">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                required
            >

            <button
                type="button"
                class="password-toggle"
                onclick="togglePassword()"
                aria-label="Show password"
            >
                👁️
            </button>

        </div>


        <button type="submit">
            🔐 Create Account
        </button>

    </form>

    <p>
        Already have an account?
        <a href="/">Login here</a>
    </p>


<script>
function togglePassword() {

    const passwordInput = document.getElementById("password");
    const toggleButton = document.querySelector(".password-toggle");

    if (passwordInput.type === "password") {

        passwordInput.type = "text";
        toggleButton.textContent = "🙈";
        toggleButton.setAttribute("aria-label", "Hide password");

    } else {

        passwordInput.type = "password";
        toggleButton.textContent = "👁️";
        toggleButton.setAttribute("aria-label", "Show password");

    }
}
</script>

</body>
</html>
